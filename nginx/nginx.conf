server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Photos are up to 25 MB (Images::Upload::MAX_SIZE_BYTES). Set ABOVE that, not equal to
    # it: a multipart body carries the boundaries and the title and album_id fields as well
    # as the file, so a 25 MB photo is a slightly larger request. The headroom is what makes
    # Rails' 422 — which names the limit — the answer to a too-large photo, rather than
    # nginx's HTML 413. Without this line the default is 1 MB, and no photo off a phone
    # uploads at all (docs: upload-size-limit/).
    #
    # proxy_request_buffering stays on (the default): nginx absorbs the slow client and hands
    # the body to the api at local speed, which keeps it inside Thruster's 30s
    # HTTP_READ_TIMEOUT and stops one slow phone occupying one of Puma's three threads.
    client_max_body_size 30m;

    # X-Forwarded-For is SET to the connecting address in both blocks below, not appended to
    # ($proxy_add_x_forwarded_for). nginx is the only published service, so $remote_addr is
    # the client. Appending kept whatever the client sent in front of it, and Rack treats
    # private addresses as trusted proxies, so a LAN client could choose the IP Rack::Attack
    # throttles it as (docs: closed-signup/02, decision 7). Infra CI fails if the append
    # comes back.

    # ActionCable is mounted at /cable in config/routes.rb, and the SPA builds
    # its socket URL from the same (empty) base as the HTTP client, so the
    # browser connects to /cable rather than /api/cable.
    location /cable {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
