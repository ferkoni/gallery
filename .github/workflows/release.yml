name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gallery-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gallery-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gallery-api:${{ github.ref_name }}

      - name: Build and push gallery-nginx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gallery-nginx:${{ github.ref_name }}

      # amd64 only, unlike the two above. This image carries a CUDA base and CUDA
      # wheels; there is no arm64 build of it worth shipping, and QEMU-emulating one
      # would take hours to produce something nobody can run.
      #
      # This is a third GHCR package, and new packages are PRIVATE by default — the
      # same trap as the first release. Until its visibility is flipped to public it
      # pulls fine from an authenticated shell and fails with `unauthorized` for every
      # self-hoster. Re-run sections 3-4 of release-smoke-test.md the first time this
      # ships.
      - name: Build and push gallery-inference
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sidecar
          platforms: linux/amd64
          push: true
          build-args: |
            SIDECAR_VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/gallery-inference:${{ github.ref_name }}

      - name: Prepare release artifacts
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/release
          sed \
            -e "s|\${GHCR_OWNER}|${OWNER}|g" \
            -e "s|\${VERSION}|${TAG}|g" \
            docker-compose.yml > /tmp/release/docker-compose.yml
          sed \
            -e "s|OWNER_PLACEHOLDER|${OWNER}|g" \
            install.sh > /tmp/release/install.sh
          chmod +x /tmp/release/install.sh
          cp setup.sh /tmp/release/setup.sh
          chmod +x /tmp/release/setup.sh
          # No substitution: the override names no image, only what to change.
          cp docker-compose.cpu.yml /tmp/release/docker-compose.cpu.yml

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            /tmp/release/docker-compose.yml \
            /tmp/release/docker-compose.cpu.yml \
            /tmp/release/install.sh \
            /tmp/release/setup.sh
