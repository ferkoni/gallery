# Re-added: the monorepo move (026d864) deleted the old one and nothing noticed.
# docs: agent-guardrails/03, slice 4.
#
# Weekly, with minor and patch updates grouped into one PR per ecosystem so the queue stays
# readable. Major updates come one per PR. This file only drives version updates; security
# updates also need "Dependabot alerts" and "Dependabot security updates" turned on in the
# repository settings, and are not grouped by these rules.
version: 2

updates:
  - package-ecosystem: bundler
    directory: /gallery-api
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /gallery-app
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # contract/ is left out: it has no lockfile and CI does not run it.

  - package-ecosystem: pip
    directory: /sidecar
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Moved by hand, never by a bot. torch and torchvision are also pinned in ci.yml's
      # CPU-wheel step, so a bump here alone would test a different build than it ships.
      # open_clip_torch can change preprocessing upstream, which moves the vector space
      # without moving model_id (see sidecar/requirements.txt).
      # ignore applies to security updates too, so advisories for these three must be
      # checked by hand.
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: open_clip_torch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /gallery-api
      - /nginx
      - /sidecar
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories:
      - /
      - /gallery-api
    schedule:
      interval: weekly
