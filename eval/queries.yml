  # ---------------------------------------------------------------------------
  # lexical — 4. Filled in already: the query IS the filename, so the answer key is
  # known without judging. These prove the hybrid did not regress exact-match search,
  # and semantic retrieval cannot possibly win them.
  #
  # Each stem below was checked to be a substring of exactly one title in the corpus,
  # so `title ILIKE '%q%'` returns precisely one row. Four naming styles on purpose.
  # If any of these files is renamed, these four entries must be updated with it.
  # ---------------------------------------------------------------------------

  - id: q30
