# Golden set for the retrieval eval (08). Written by hand; see
# ~/Documents/docs/gallery/ai-feature/08b-corpus-setup.md §5.
#
# CONTRACT
#   - Photos are referenced as `group/filename` so a judgement is human-checkable
#     without opening a database.
#   - Queries are Spanish, matching the corpus and the multilingual checkpoint
#     (xlm-roberta-base-ViT-B-32 / laion5b_s13b_b90k).
#   - `relevant:` is filled in by JUDGING THE TOP 10 of a run, not by scanning the
#     corpus (§6 pooling). It grows over time; when it does, old runs get re-scored
#     against the new key from their stored raw output.
#   - GROUPS ARE NOT THE ANSWER KEY. A photo lives in exactly one group directory
#     (Image belongs_to :album, album_id null: false — one album per image, no join
#     table), but it may be relevant to queries from any group. A building
#     photographed on a trip is filed once and listed under both the buildings and
#     the tourism queries. Never duplicate a file to express that: two copies are two
#     Image rows with identical vectors but different titles, so lexical matches one
#     and semantic matches both, biasing the exact comparison this eval exists for.
#     The `group:` field below is a balance tag for spreading the 24 descriptive
#     queries evenly, not a restriction on what may appear in `relevant:`.
#   - `relevant: []` means NOT JUDGED, and is excluded from the averages. A query that
#     was judged and had no relevant photo in its pool carries `judged: true` beside
#     the empty list, and scores zero like any other miss. The two are opposites and an
#     empty list alone cannot tell them apart — which matters because the query the
#     retriever failed hardest on is the one that would quietly leave the average.
#
# WRITING THE `query:` LINES — the one rule that matters
#   Write each query from WHAT IS IN THE PHOTO, never from its filename. A query that
#   echoes a descriptive filename hands the lexical baseline a free win and makes the
#   whole comparison meaningless. If you find yourself looking at the filename to
#   write the query, close the file listing and open the photo instead.
#   The `lexical` block below is the deliberate exception: those queries ARE filenames.
#
# VERSIONING
#   `version` tracks the JUDGEMENT STANDARD, not the size of the answer key. Growing
#   `relevant:` from pooling is normal and stays at the same version. Bump only if the
#   relevance criteria themselves change, and copy to queries-v2.yml rather than
#   editing this file, so old result files stay meaningful.

version: 1
judged_by: "Fernando"          # who made the relevance calls (08: record the judge)
judged_at: "2026-09-10"          # YYYY-MM-DD of the judging pass
corpus_sha: "4db305ef4a8f185639ebe10d3f03c526f46dc93d082a34ecb0bb2e1264825810"         # filled by `rake eval:corpus_sha` once filenames are frozen

