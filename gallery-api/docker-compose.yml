services:
  db:
    # Pinned, not floating — same reasoning as the root docker-compose.yml: `pg16` tracks
    # whatever base OS upstream ships, and crossing glibc versions under an existing volume
    # risks subtly wrong text indexes. Keep this in step with the root compose file; a split
    # pin means a different Postgres depending on which directory you run from.
    image: pgvector/pgvector:0.8.6-pg16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
