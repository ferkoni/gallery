default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "localhost" } %>
  port: <%= ENV.fetch("POSTGRES_PORT") { 5432 } %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB") { "gallery_api_development" } %>
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_CABLE_DB") { "gallery_api_development_cable" } %>
    migrations_paths: db/cable_migrate
  # Mirrors the production entry added in #21. Development ran on the :async adapter
  # until 06, which is an in-process MULTI-THREADED pool — so it would run several
  # inference jobs at once against one GPU, and the resulting CUDA OOM would appear
  # only locally and never in production. That direction is backwards from usual and
  # easy to misdiagnose as a code bug.
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_QUEUE_DB") { "gallery_api_development_queue" } %>
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: gallery_api_test

production:
  primary: &primary_production
    <<: *default
    database: gallery_api_production
    username: gallery_api
    password: <%= ENV["GALLERY_API_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: gallery_api_production_cache
    migrations_paths: db/cache_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("POSTGRES_CABLE_DB") { "gallery_api_production_cable" } %>
    migrations_paths: db/cable_migrate
  queue:
    <<: *primary_production
    database: gallery_api_production_queue
    migrations_paths: db/queue_migrate
